<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Photo Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
      :root {
        --background: #f7f8fa; /* neutral-50 */
        --foreground: #18181b; /* zinc-900 */
        --card: #ffffff;
        --card-foreground: #18181b;
        --primary: #3b82f6; /* blue-500 */
        --primary-foreground: #ffffff;
        --secondary: #f1f5f9; /* slate-100 */
        --secondary-foreground: #18181b;
        --muted: #f1f5f9; /* slate-100 */
        --muted-foreground: #64748b; /* slate-500 */
        --border: #e2e8f0; /* slate-200 */
        --input: #e2e8f0;
        --ring: #3b82f6;
      }

      html.dark {
        --background: #09090b; /* zinc-950 */
        --foreground: #f4f4f5; /* zinc-100 */
        --card: #18181b; /* zinc-900 */
        --card-foreground: #f4f4f5;
        --primary: #60a5fa; /* blue-400 */
        --primary-foreground: #09090b;
        --secondary: #27272a; /* zinc-800 */
        --secondary-foreground: #f4f4f5;
        --muted: #27272a;
        --muted-foreground: #a1a1aa; /* zinc-400 */
        --border: #27272a;
        --input: #27272a;
        --ring: #60a5fa;
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
        transition: background-color 0.3s, color 0.3s;
      }
      
      .control-panel-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .control-panel-scrollbar::-webkit-scrollbar-track {
        background: var(--secondary);
        border-radius: 10px;
      }
      .control-panel-scrollbar::-webkit-scrollbar-thumb {
        background-color: var(--muted-foreground);
        border-radius: 10px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.1",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
        }
      }
    </script>
</head>
  <body class="bg-[var(--background)]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
